[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hw-verify-mcp"
version = "0.1.0"
description = "MCP server exposing hardware constant-time, masking, and patch-completeness verification to AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["mcp", "model-context-protocol", "hardware", "verification", "constant-time", "masking", "agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Topic :: Security",
  "Programming Language :: Python :: 3",
]
dependencies = [
  "mcp>=1.2,<2",
  # Not on PyPI yet, so referenced directly from their public repositories: this is
  # what makes `pip install .` work today in a clean environment. PEP 508 direct
  # references cannot be uploaded to PyPI, so replace these with plain version
  # specifiers at the point the three checkers are published.
  "ctbench @ git+https://github.com/nickharris808/ctbench@main",
  "ct-mask @ git+https://github.com/nickharris808/ct-mask@main",
  "patchproof @ git+https://github.com/nickharris808/patchproof@main",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "anyio>=4", "ruff>=0.14,<0.15"]

[project.scripts]
hw-verify-mcp = "hwverify.server:main"

[tool.setuptools]
packages = ["hwverify"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "PERF", "ISC", "PL"]
# PLC0415: local imports are deliberate (optional deps, per-test isolation).
# PLR0913: keyword-only builder functions legitimately take many fields.
ignore = ["PLR2004", "PLR0912", "PLR0915", "PLR0913", "E501", "PLC0415", "PERF203"]
